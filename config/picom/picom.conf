# Rounded corners (dock/polybar included, so the bar is rounded too;
# polybar's own "radius" setting also rounds it independently)
corner-radius = 16;
rounded-corners-exclude = [
  "window_type = 'desktop'"
];
round-borders = 1;

# NOTE: polybar's background color already has an alpha channel baked in
# (see ~/.config/polybar/config.ini), so no opacity-rule for dock windows
# here — stacking both would double up the transparency.

# Backend
backend = "glx";
vsync = true;

# Animations (FT-Labs picom fork). The "tag change" animation options in
# the example config are dwm-specific and don't apply to i3, so they're
# left out here — just per-window open/close/popup animations.
animations = true;
animation-stiffness-in-tag = 125;
animation-window-mass = 0.4;
animation-dampening = 15;
animation-clamping = true;

animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-for-transient-window = "slide-down";

# i3 uses pixel borders instead of title bars now, so no need to
# specifically strip window decorations here.
